basePath: /api
definitions:
  ds.Class:
    properties:
      color:
        type: string
      examples:
        type: string
      id:
        type: integer
      image:
        type: string
      isDeleted:
        type: boolean
      massRequestToClass:
        items:
          $ref: '#/definitions/ds.MassRequestToClass'
        type: array
      name:
        type: string
      spectre:
        type: string
      temperature:
        type: integer
    type: object
  ds.MassRequest:
    properties:
      closedAt:
        type: string
      createdAt:
        type: string
      formedAt:
        type: string
      id:
        type: integer
      massRequestToClass:
        items:
          $ref: '#/definitions/ds.MassRequestToClass'
        type: array
      moderator:
        $ref: '#/definitions/ds.User'
      moderatorId:
        type: integer
      status:
        description: 1 - draft, 2 - deleted, 3 - pending, 4 - resolved, 5 - rejected
        type: integer
      user:
        $ref: '#/definitions/ds.User'
      userID:
        type: integer
    type: object
  ds.MassRequestToClass:
    properties:
      calcRequest:
        $ref: '#/definitions/ds.MassRequest'
      class:
        $ref: '#/definitions/ds.Class'
      classID:
        type: integer
      luminosity:
        type: integer
      mass:
        type: integer
      requestID:
        type: integer
    type: object
  ds.User:
    properties:
      id:
        type: integer
      isMod:
        type: boolean
      passHash:
        type: string
      passSalt:
        type: string
      username:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      role:
        type: string
      token_type:
        type: string
      user_id:
        type: integer
    type: object
  handler.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.RegisterResponse:
    properties:
      message:
        type: string
      user_id:
        type: integer
    type: object
  handler.UpdateProfileRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для расчета масс звезд в заявках
  title: Stellar Mass Calculation API
  version: "1.0"
paths:
  /classes:
    get:
      consumes:
      - application/json
      description: Get list of spectral classes with optional filtering
      parameters:
      - description: Filter by class name
        in: query
        name: name
        type: string
      - description: Filter by color
        in: query
        name: color
        type: string
      - description: Filter by spectral class
        in: query
        name: spectre
        type: string
      - description: Filter by minimum temperature
        in: query
        name: min_temp
        type: integer
      - description: Filter by maximum temperature
        in: query
        name: max_temp
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ds.Class'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all spectral classes
      tags:
      - classes
    post:
      consumes:
      - application/json
      description: Create a new spectral class (Moderator only)
      parameters:
      - description: Class data
        in: body
        name: class
        required: true
        schema:
          $ref: '#/definitions/ds.Class'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create new spectral class
      tags:
      - classes
  /classes/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a spectral class (Moderator only)
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete spectral class
      tags:
      - classes
    get:
      consumes:
      - application/json
      description: Get detailed information about a specific spectral class
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.Class'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get spectral class by ID
      tags:
      - classes
    put:
      consumes:
      - application/json
      description: Update spectral class information (Moderator only)
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: updates
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update spectral class
      tags:
      - classes
  /classes/{id}/image:
    put:
      consumes:
      - application/json
      description: Update spectral class image URL from MinIO
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      - description: Image URL data
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update class image URL
      tags:
      - classes
  /classes/{id}/page:
    get:
      description: Get HTML page with class information
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Get class page (HTML)
      tags:
      - classes
  /mass-requests:
    get:
      consumes:
      - application/json
      description: Get mass requests with optional filters
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: integer
      - description: Filter from date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter to date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ds.MassRequest'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get mass requests
      tags:
      - mass-requests
    post:
      consumes:
      - application/json
      description: Create a new draft mass request
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create mass request
      tags:
      - mass-requests
  /mass-requests/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a draft mass request
      parameters:
      - description: Mass Request ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete mass request
      tags:
      - mass-requests
    get:
      consumes:
      - application/json
      description: Get detailed information about a specific mass request
      parameters:
      - description: Mass Request ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.MassRequest'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get mass request by ID
      tags:
      - mass-requests
    put:
      consumes:
      - application/json
      description: Update fields of a draft mass request
      parameters:
      - description: Mass Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: updates
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update mass request
      tags:
      - mass-requests
  /mass-requests/{id}/classes/{class_id}:
    put:
      consumes:
      - application/json
      description: Update class parameters in mass request
      parameters:
      - description: Request ID
        in: path
        name: request_id
        required: true
        type: integer
      - description: Class ID
        in: path
        name: class_id
        required: true
        type: integer
      - description: Update data
        in: body
        name: updates
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update request class item
      tags:
      - request-classes
  /mass-requests/{id}/complete:
    put:
      consumes:
      - application/json
      description: Complete or reject a mass request with calculations (moderator
        only)
      parameters:
      - description: Mass Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Action data
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Complete mass request
      tags:
      - mass-requests
  /mass-requests/{id}/form:
    put:
      consumes:
      - application/json
      description: Submit draft request for moderation
      parameters:
      - description: Mass Request ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Form mass request
      tags:
      - mass-requests
  /mass-requests/{request_id}/classes/{class_id}:
    delete:
      consumes:
      - application/json
      description: Remove spectral class from mass request
      parameters:
      - description: Request ID
        in: path
        name: request_id
        required: true
        type: integer
      - description: Class ID
        in: path
        name: class_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove class from request
      tags:
      - request-classes
  /mass-requests/classes:
    post:
      consumes:
      - application/json
      description: Add spectral class to draft mass request
      parameters:
      - description: Class data
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            format: int64
            type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add class to request
      tags:
      - request-classes
  /mass-requests/star-calculation:
    get:
      consumes:
      - application/json
      description: Get draft request ID and item count for current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get star calculation cart info
      tags:
      - mass-requests
  /users/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - users
  /users/logout:
    post:
      consumes:
      - application/json
      description: Invalidate JWT token by adding it to blacklist
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - users
  /users/profile:
    get:
      consumes:
      - application/json
      description: Get current authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update current authenticated user's profile (username and/or password)
      parameters:
      - description: Profile update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - users
  /users/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with username and password
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
